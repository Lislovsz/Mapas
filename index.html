<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontos de Vendas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f0f2f5;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        #filter-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }
        #filter-container .titulo {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            color: #2cd5c4;
            margin: 0;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        #bairroInput {
            width: 100%;
            padding: 12px 40px 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fff;
            font-weight: 500;
            font-family: 'Montserrat', sans-serif;
        }
        #bairroInput:focus {
            border-color: #2cd5c4;
            box-shadow: 0 0 0 3px rgba(44, 213, 196, 0.15);
        }
        #btnBuscar {
            position: absolute;
            right: 8px;
            background: #2cd5c4;
            border: none;
            border-radius: 8px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        #btnBuscar:hover {
            background: #1ab8a8;
        }
        #btnBuscar svg {
            width: 14px;
            height: 14px;
            fill: white;
        }
        .raio-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .raio-row label {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: #718096;
            font-weight: 600;
            white-space: nowrap;
        }
        #raioSlider {
            flex: 1;
            accent-color: #2cd5c4;
            cursor: pointer;
        }
        #raioValor {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #2cd5c4;
            min-width: 42px;
            text-align: right;
        }
        #contador {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: #898c92;
            font-weight: 600;
            text-align: left;
            padding: 6px 10px;

            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);

            border-radius: 10px;

            border-left: 3px solid #2cd5c4;

        }
        #statusGeo {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            color: #a0aec0;
            font-weight: 500;
            text-align: center;
            min-height: 14px;
        }
        #erroServidor {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            background: #fff5f5;
            border: 1.5px solid #fc8181;
            border-radius: 14px;
            padding: 14px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: #c53030;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 380px;
            width: calc(100% - 40px);
        }
    </style>
</head>
<body>
    <div id="filter-container">
        <div class="titulo">Pontos de Venda</div>
        <div class="input-wrapper">
            <input type="text" id="bairroInput" placeholder="Digite o bairro..."
                onkeydown="if(event.key==='Enter') buscarPorBairro();">
            <button id="btnBuscar" onclick="buscarPorBairro()"><svg viewBox="0 0 24 24">
                    <path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke="white" stroke-width="2.5"
                        stroke-linecap="round" fill="none" />
                </svg></button>
        </div>
        <div class="raio-row">
            <label>Raio:</label>
            <input type="range" id="raioSlider" min="500" max="10000" step="500" value="2000"
                oninput="atualizarRaioLabel(this.value); if(centroAtual) aplicarFiltroRaio();">
            <span id="raioValor">2,0 km</span>
        </div>
        <div id="statusGeo"></div>
        <div id="contador">Carregando...</div>
    </div>
    <div id="map"></div>
    <div id="erroServidor">⚠️ Servidor não encontrado</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-22.90, -43.20], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OSM & CartoDB' }).addTo(map);
        let todosOsPontos = [];
        let markersGroup = L.featureGroup().addTo(map);
        let circuloRaio = null;
        let centroAtual = null;
        const iconCard = L.icon({ iconUrl: 'alfinete.png', iconSize: [35, 35], iconAnchor: [17, 35], popupAnchor: [0, -18] });
        const iconPiu = L.icon({ iconUrl: 'marcador.png', iconSize: [35, 35], iconAnchor: [17, 35], popupAnchor: [0, -18] });
        function atualizarRaioLabel(metros) { document.getElementById('raioValor').textContent = `${(metros / 1000).toFixed(1).replace('.', ',')} km`; }
        function distanciaMetros(lat1, lng1, lat2, lng2) { const R = 6371000; const dLat = (lat2 - lat1) * Math.PI / 180; const dLng = (lng2 - lng1) * Math.PI / 180; const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2; return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); }
        function mostrarPontos(lista) {
            markersGroup.clearLayers();
            lista.forEach(pdv => {
                const icone = pdv.tipo === 'CARD' ? iconCard : iconPiu;
                L.marker(pdv.coords, { icon: icone }).bindPopup(pdv.popup).addTo(markersGroup);

            });
        }
        function carregarDados() {
            fetch('dados.json')
                .then(res => res.json())
                .then(data => {
                    todosOsPontos = data;
                    mostrarPontos(data);
                    document.getElementById('contador').innerHTML = `Total: ${data.length} pontos`;

                })
                .catch(() => document.getElementById('erroServidor').style.display = 'block');
        }
        function aplicarFiltroRaio() {
            if (!centroAtual) return;
            const raioMetros = parseInt(document.getElementById('raioSlider').value);
            if (circuloRaio) map.removeLayer(circuloRaio);
            circuloRaio = L.circle([centroAtual.lat, centroAtual.lng], { radius: raioMetros, color: '#2cd5c4', fillColor: '#2cd5c4', fillOpacity: 0.08, weight: 2, dashArray: '6 4' }).addTo(map);
            const filtrados = todosOsPontos.filter(p => distanciaMetros(centroAtual.lat, centroAtual.lng, p.coords[0], p.coords[1]) <= raioMetros);
            // LÓGICA DE CONTAGEM ÚNICA
            const locaisUnicos = new Set();
            filtrados.forEach(p => locaisUnicos.add(p.coords.join(',')));
            const qtdVisual = locaisUnicos.size;
            mostrarPontos(filtrados);
            const raioKm = (raioMetros / 1000).toFixed(1).replace('.', ',');
            document.getElementById('contador').innerHTML = `${qtdVisual} ${qtdVisual === 1 ? 'encontrado' : 'encontrados'} em ${raioKm} km`;
            map.fitBounds(circuloRaio.getBounds().pad(0.1));
        }
        async function buscarPorBairro() {
            const termo = document.getElementById('bairroInput').value.trim();
            if (!termo) { resetarFiltro(); return; }
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(termo)}, Rio de Janeiro, Brasil&format=json&limit=1`);
                const data = await res.json();
                if (data.length > 0) {
                    centroAtual = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                    aplicarFiltroRaio();
                }
            } catch (e) { console.error(e); }
        }
        function resetarFiltro() {
            centroAtual = null;
            if (circuloRaio) { map.removeLayer(circuloRaio); circuloRaio = null; }
            mostrarPontos(todosOsPontos);
            document.getElementById('contador').innerHTML = `Total: ${todosOsPontos.length} pontos`;
        }
        atualizarRaioLabel(2000);
        carregarDados();
    </script>
</body>
</html>
